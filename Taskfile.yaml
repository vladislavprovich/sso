version: '3'

tasks:
  migrate:
    desc: "Run database migrations"
    cmds:
      - echo "Starting migration..."
      - go run cmd/migrator/main.go --storage-path=./storage/sso.db --migrations-path=./migrations
    silent: false

  start:
    desc: "Start local service"
    cmds:
      - echo "Starting local service..."
      - go run cmd/sso/main.go --config=./config/local_test.yaml
    ignore_error: true
    silent: false

  migrate-and-start:
    desc: "Run migrations and start local service"
    cmds:
      - echo "Starting local service and Migration..."
      - task: migrate
      - task: start