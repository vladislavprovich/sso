env: "local" # dev, prod
# "./storage/sso.db"
#storage_path: "postgres://user:password@localhost:5432/sso?sslmode=disable"
database:
  driver: "postgres"
  host: "postgres_sso"
  port: 5432
  user: "test"
  password: "test"
  dbname: "ssotest"
  sslmode: "disable"
  max_connections: 10  # for test
  max_idle_connections: 5  # for test
  conn_max_lifetime: 1h
grpc:
  port: 44043
  timeout: 1h
otel:
  endpoint: "otel-lgtm:4317" # gRPC for OTEL
  metrics_port: 9090     # Prometheus metrics port.
  adr: ":9090"
logging:
  level: "debug"
  format: "json"  # or "text"
  loki_url: "http://otel-lgtm:3100/loki/api/v1/push"
tracing:
  tempo_url: "http://otel-lgtm:3200"